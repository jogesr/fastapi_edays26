<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e2e4e9;
            --text: #1f2430;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 0.75rem 1.25rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
        }
        header h1 { font-size: 1.1rem; margin: 0; }
        header small { color: var(--muted); }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 52rem;
            width: 100%;
            margin: 0 auto;
        }
        .msg {
            padding: 0.6rem 0.9rem;
            border-radius: 0.75rem;
            max-width: 85%;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.45;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 0.2rem;
        }
        .msg.assistant {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 0.2rem;
        }
        .msg.assistant.pending::after {
            content: "▌";
            animation: blink 1s step-end infinite;
            color: var(--muted);
        }
        .msg.error {
            align-self: flex-start;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }
        @keyframes blink { 50% { opacity: 0; } }
        form {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
            max-width: 52rem;
            width: 100%;
            margin: 0 auto;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        button {
            padding: 0.65rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>{{ title }}</h1>
        <small>Modell: {{ model }}</small>
    </header>

    <div id="messages"></div>

    <form id="chat-form">
        <input type="text" id="prompt" placeholder="Nachricht eingeben …"
               autocomplete="off" autofocus required>
        <button type="submit" id="send">Senden</button>
    </form>

    <script>
        const messages = document.getElementById("messages");
        const form = document.getElementById("chat-form");
        const promptInput = document.getElementById("prompt");
        const sendButton = document.getElementById("send");

        function addMessage(role, text = "") {
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage("user", prompt);
            promptInput.value = "";
            sendButton.disabled = true;

            const answer = addMessage("assistant");
            answer.classList.add("pending");

            try {
                // Read the /chat response body chunk by chunk so tokens
                // appear while the LLM is still generating.
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt }),
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    answer.textContent += decoder.decode(value, { stream: true });
                    messages.scrollTop = messages.scrollHeight;
                }
            } catch (err) {
                answer.remove();
                addMessage("error", `Fehler: ${err.message}`);
            } finally {
                answer.classList.remove("pending");
                sendButton.disabled = false;
                promptInput.focus();
            }
        });
    </script>
</body>
</html>
